[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-index-mcp-simple"
version = "3.0.0"
description = "Code indexing and analysis tools for LLMs using MCP (Simple Fork)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "catlog22"}
]
dependencies = [
    "mcp>=0.3.0",
    "tree-sitter>=0.20.0",
    "tree-sitter-javascript>=0.20.0",
    "tree-sitter-typescript>=0.20.0",
    "tree-sitter-java>=0.20.0",
    "tree-sitter-zig>=0.20.0",
    "pathspec>=0.12.1",
    "msgpack>=1.0.0",
]

[project.optional-dependencies]
watcher = ["watchdog>=3.0.0"]

[project.urls]
Homepage = "https://github.com/catlog22/code-index-mcp-simple"
"Bug Tracker" = "https://github.com/catlog22/code-index-mcp-simple/issues"
"Original Project" = "https://github.com/johnhuang316/code-index-mcp"

[project.scripts]
code-index-mcp-simple = "code_index_mcp.server:main"
code-index-mcp = "code_index_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}
